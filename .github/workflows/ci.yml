name: PassGuard checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build services and isolated scanner
        run: docker compose --profile ops build
      - name: Generate local TLS material
        run: docker compose run --rm --no-deps tools python -m scripts.prepare
      - name: Start PostgreSQL and Vault
        run: docker compose up -d postgres vault
      - name: Configure Vault and database roles
        run: docker compose run --rm tools python -m scripts.bootstrap
      - name: Start demo application
        run: docker compose up -d --wait demo
      - name: Check API through the published host port
        run: curl --fail --silent --show-error --noproxy "*" --connect-timeout 5 --max-time 20 http://127.0.0.1:8001/ready
      - name: Prove credential rotation and permission restrictions
        run: docker compose run --rm tools python -m scripts.verify_rotation
      - name: Restart Vault with its existing storage
        run: docker compose restart vault
      - name: Unseal Vault and repeat the experiment
        run: |
          docker compose run --rm tools python -m scripts.unseal
          docker compose run --rm tools python -m scripts.verify_rotation
      - name: Upgrade the existing installation with the control API
        run: |
          docker compose run --rm tools python -m scripts.setup_control
          docker compose run --rm tools python -m scripts.setup_control
      - name: Upgrade the existing control database with immutable scanner reports
        run: |
          docker compose run --rm tools python -m scripts.setup_scanner
          docker compose run --rm tools python -m scripts.setup_scanner
      - name: Start and check the control API from the Docker host
        run: |
          docker compose up -d --wait control
          curl --fail --silent --show-error --noproxy "*" --max-time 20 http://127.0.0.1:8000/ready
      - name: Verify sessions, roles, audit and API-driven rotation
        run: docker compose run --rm tools python -m scripts.verify_control --check-last-admin
      - name: Verify real Gitleaks detection and safe reports
        run: docker compose run --rm tools python -m scripts.verify_scanner
      - name: Verify control API after Vault restart
        run: |
          docker compose restart vault
          docker compose run --rm tools python -m scripts.unseal
          docker compose run --rm tools python -m scripts.verify_control --check-last-admin
          docker compose run --rm tools python -m scripts.verify_scanner
      - name: Verify installed panel and same-origin API
        run: docker compose run --rm tools python -m scripts.verify_panel
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test real panel workflows in Chromium
        working-directory: frontend
        env:
          PASSGUARD_VISUAL_QA: '1'
        run: npm run test:e2e
      - name: Check scanner isolation and input cleanup
        run: |
          docker compose exec -T scanner python - <<'PY'
          import os
          from pathlib import Path
          import socket
          import subprocess
          assert '8.30.1' in subprocess.check_output(['/usr/local/bin/gitleaks', 'version'], text=True)
          assert not Path('/run/identity').exists() and not Path('/state').exists()
          assert 'VAULT_ADDR' not in os.environ and 'DB_HOST' not in os.environ
          assert not list(Path('/tmp').glob('passguard-scan-*'))
          for host in ('vault', 'postgres'):
              try:
                  socket.getaddrinfo(host, None)
              except socket.gaierror:
                  continue
              raise AssertionError('Scanner can resolve a protected backend service')
          print('Scanner version, network isolation and source cleanup verified')
          PY
      - name: Show sanitized service logs on failure
        if: failure()
        run: docker compose logs --tail 100 postgres vault demo control scanner
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rotation-report
          path: reports/*.json
          if-no-files-found: ignore
      - name: Remove this disposable CI environment
        if: always()
        run: docker compose --profile ops down --volumes

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

# The official entrypoint uses a local socket during initial database creation.
local   all   all                         trust
# All TCP connections must use TLS and SCRAM; no host ports are published.
hostssl all   all   0.0.0.0/0             scram-sha-256
hostssl all   all   ::/0                  scram-sha-256
host    all   all   0.0.0.0/0             reject
host    all   all   ::/0                  reject
